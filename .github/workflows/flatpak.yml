# Test build of the Flatpak (packaging/flatpak) the way Flathub builds it: offline, from the
# checked-out sources. Run it manually (Actions -> Flatpak -> Run workflow) after changing the
# manifest, the metainfo or a Maven dependency. The result is a .flatpak bundle artifact that
# installs on any Linux with: flatpak install --user WinGit.flatpak
name: Flatpak

on:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      MANIFEST: packaging/flatpak/io.github.biblelamp.WinGit.yml
      APP_ID: io.github.biblelamp.WinGit
    steps:
      - uses: actions/checkout@v5

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: WinGit.flatpak
          manifest-path: ${{ env.MANIFEST }}
          cache-key: flatpak-builder-${{ github.sha }}

      # Flathub's linter: errors here would block the Flathub submission. Expected in this test
      # build: appstream-external-screenshot-url and appstream-screenshots-not-mirrored-in-ostree
      # (Flathub's own build mirrors the screenshots).
      - name: Lint
        continue-on-error: true
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$MANIFEST"
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      # The bundled git, ssh and Java must work inside the sandbox
      - name: Smoke test
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive WinGit.flatpak
          flatpak run --command=sh "$APP_ID" -c 'git --version && (command -v ssh || echo "no ssh client") && /app/jre/bin/java -version'
