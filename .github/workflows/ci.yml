# Build and run all tests on every push to main and on pull requests, on Windows and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: mvn -B -ntp verify

      # Swing tests need a display: a virtual X server
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -ntp verify
