# Builds the Windows installer (MSI) and a portable ZIP (app image).
#
# - Push a tag like v0.3.0 (or v0.3.0-beta.1 for a pre-release) -> a GitHub Release
#   with both files attached.
# - Run manually (Actions -> Release -> Run workflow) -> the same files as a workflow
#   artifact only, no release; useful to check packaging before tagging.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test build (numbers only, e.g. 0.3.0)'
        required: true
        default: '0.3.2'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          # jpackage on Windows accepts only numeric versions: v0.2.0-beta.1 -> 0.2.0
          numeric="${version%%-*}"
          if ! [[ "$numeric" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$version' must look like 1.2.3 or 1.2.3-suffix"
            exit 1
          fi
          prerelease=false
          [ "$numeric" != "$version" ] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Ensure WiX 3 (needed by jpackage for MSI)
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          $find = { Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $wix = & $find
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = & $find
          }
          if (-not $wix) { throw 'WiX Toolset 3 not found' }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Package MSI and app image
        env:
          NUMERIC: ${{ steps.version.outputs.numeric }}
        run: |
          mvn -B -ntp -pl app -am -Ppackage -DskipTests package -Djpackage.appVersion="$NUMERIC"
          mvn -B -ntp -pl app -am -Ppackage -DskipTests package -Djpackage.appVersion="$NUMERIC" -Djpackage.type=app-image

      - name: Collect files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "app/target/installer/WinGit-$env:NUMERIC.msi" "dist/WinGit-$env:VERSION-windows-x64.msi"
          Compress-Archive -Path app/target/installer/WinGit -DestinationPath "dist/WinGit-$env:VERSION-windows-x64.zip"
          Get-ChildItem dist

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WinGit-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$tag" dist/* --title "WinGit $VERSION" --generate-notes "${flags[@]}"
          fi
