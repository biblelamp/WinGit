# Publishes the project page (site/) to GitHub Pages: https://wgit.cz/
# (custom domain, set in Settings -> Pages; biblelamp.github.io/WinGit/ redirects there).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ui/src/main/resources/cz/wingit/ui/icons/app/wingit.svg'
      - 'app/src/jpackage/wingit.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # the app icon has a single source of truth in the ui module
          cp ui/src/main/resources/cz/wingit/ui/icons/app/wingit.svg _site/assets/wingit.svg
          # 256 px PNG: the Chocolatey package icon (iconUrl) points here
          cp app/src/jpackage/wingit.png _site/assets/wingit.png

      - uses: actions/configure-pages@v6

      # a name per attempt: a re-run keeps the artifact of the failed attempt in the same run,
      # and deploy-pages refuses to choose between two artifacts of the same name
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
