# Publishes the project page (site/) to GitHub Pages: https://wgit.cz/
# (custom domain, set in Settings -> Pages; biblelamp.github.io/WinGit/ redirects there).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ui/src/main/resources/cz/wingit/ui/icons/app/wingit.svg'
      - 'app/src/jpackage/wingit.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: in one job deploy-pages@v5 sometimes does not see the
  # artifact just uploaded ("No artifacts named ...", actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # the app icon has a single source of truth in the ui module
          cp ui/src/main/resources/cz/wingit/ui/icons/app/wingit.svg _site/assets/wingit.svg
          # 256 px PNG: the Chocolatey package icon (iconUrl) points here
          cp app/src/jpackage/wingit.png _site/assets/wingit.png

      - uses: actions/configure-pages@v6

      # a name per attempt: "Re-run all jobs" keeps the artifact of the earlier attempt in the
      # same run, and deploy-pages refuses to choose between two artifacts of the same name
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # the name comes from the build job, so "Re-run failed jobs" deploys the artifact it made
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
